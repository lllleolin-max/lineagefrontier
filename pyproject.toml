[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "lineagefrontier"
version = "0.1.0"
description = "Local artifact provenance impact and costed rebuild evidence"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "LineageFrontier contributors"}]
dependencies = []

[project.scripts]
lineagefrontier = "lineagefrontier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m pip install --no-index --find-links dist lineagefrontier
      - run: python -m unittest discover -s tests -v
      - run: python examples/workflow.py
      - run: python benchmarks/compare.py
